# BI stack: Postgres serving DB (gold marts) + Metabase with its own Postgres app DB.
#   cp .env.example .env && docker compose up -d
#   Metabase: http://localhost:3001   Serving DB: localhost:5434
name: pourstream-bi

services:
  serving-db:
    image: postgres:16
    container_name: pourstream-serving-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: ${SERVING_DB_USER}
      POSTGRES_PASSWORD: ${SERVING_DB_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - serving_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVING_DB_USER} -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase-db:
    image: postgres:16
    container_name: pourstream-metabase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
    volumes:
      - metabase_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.63.19.1
    container_name: pourstream-metabase
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
      serving-db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: metabase-db
      JAVA_TIMEZONE: Asia/Manila
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  serving_data:
  metabase_app_data:
