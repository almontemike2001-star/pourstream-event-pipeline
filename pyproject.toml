[project]
name = "pourstream"
version = "0.1.0"
description = "Streaming order-event pipeline for a synthetic coffee chain: Kafka -> contract-validated micro-batches -> Parquet lake -> dbt-duckdb marts."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "confluent-kafka>=2.5",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pydantic>=2.8",
    "dbt-core>=1.11,<2",
    "dbt-duckdb>=1.9",
]

[project.scripts]
pourstream = "pourstream.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pourstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "kafka: needs a reachable Kafka/Redpanda broker (KAFKA_BOOTSTRAP)",
    "e2e: runs the full pipeline including dbt build",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"bi/**" = ["E501"]  # embedded SQL in dashboard definitions
